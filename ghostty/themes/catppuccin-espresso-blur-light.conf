# Catppuccin Espresso (Blur) [Light] port for Ghostty
# Source: https://github.com/jenslys/zed-catppuccin-blur
# Note: "[Light]" = light blur variant, not a light-mode theme (appearance: dark).
# Terminal background is fully transparent in the original — pair with
# background-opacity + background-blur-radius in your main config.

background = #000000
background-opacity = 0.6
foreground = #cad3f5

cursor-color = #f4dbd6
cursor-text = #000000

selection-background = #939ab7
selection-foreground = #cad3f5

# Normal colors
palette = 0=#494d64
palette = 1=#ed8796
palette = 2=#a6da95
palette = 3=#eed49f
palette = 4=#8aadf4
palette = 5=#f5bde6
palette = 6=#8bd5ca
palette = 7=#a5adcb

# Bright colors
palette = 8=#5b6078
palette = 9=#ec7486
palette = 10=#8ccf7f
palette = 11=#e1c682
palette = 12=#78a1f6
palette = 13=#f2a9dd
palette = 14=#63cbc0
palette = 15=#b8c0e0
