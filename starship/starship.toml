format = """
$directory\
${custom.home}\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$aws\
${custom.docker}${custom.compose}\
$docker_context\
$jobs\
$line_break\
$character"""


add_newline = false
# palette = "nord"
palette = "catppuccin_mocha"
command_timeout = 2000

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
read_only = " 󰌾"

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[custom.home]
detect_folders = ['.config']
when = 'test "$PWD" = "$HOME"'
command = 'printf ""'
style = 'fg:dark_blue'
format = '[$output ]($style)'

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'

[fill]
symbol = ''

[python]
style = 'teal'
symbol = ' '
pyenv_version_name = false
format = '[$symbol($version )(\($virtualenv\) )]($style)'
detect_files = ['.python-version', 'Pipfile', '__init__.py', 'pyproject.toml', 'requirements.txt', 'setup.py', 'tox.ini', 'uv.lock']
python_binary = ['python3', 'python']

#[custom.claude]
#description = "Claude Code rate limits (5h / 7d), захваченные из statusline CC"
#when = 'test -s "${XDG_CACHE_HOME:-$HOME/.cache}/claude-usage"'
#command = 'cat "${XDG_CACHE_HOME:-$HOME/.cache}/claude-usage"'
#style = 'teal'
#format = ' [󰧑 $output]($style)'
#format = '[· 󰚩 $output ]($style)'

[custom.venv]
description = "venv present"
detect_folders = ['.venv', 'venv']
command = 'printf ""'
style = 'teal'
format = '[󰌠 ]($style)'

[custom.uv]
description = "uv project"
detect_files = ['uv.lock']
command = 'printf "uv"'
style = 'teal'
format = '[$output ]($style)'

[lua]
format = '[$symbol($version )]($style)'
symbol = ' '

[nodejs]
style = 'blue'
# symbol = ' '
symbol = ' '

[golang]
style = 'blue'
# symbol = ' '
symbol = " "

[haskell]
style = 'blue'
symbol = " "

[rust]
style = 'orange'
symbol = "󱘗 "

[ruby]
style = 'blue'
symbol = " "

[package]
# symbol = '󰏗 '
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

